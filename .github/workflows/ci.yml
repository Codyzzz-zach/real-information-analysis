name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The whole suite is offline (fake HTTP clients + recorded fixtures),
      # so plain pytest is all CI needs - zero dependencies to install.
      - name: Run tests
        run: python -m pytest tests/ -q
