name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The whole suite is offline (fake HTTP clients + recorded fixtures)
      # and stdlib-only - run it via unittest so no dependency install is
      # needed (pytest is not part of the project's zero-dependency surface).
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
